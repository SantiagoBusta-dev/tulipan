<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siete pétalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #241a30;
    --night-deep: #170f20;
    --gold: #d3a15c;
    --gold-soft: #e6c48a;
    --cream: #f3e9dd;
    --stem: #43a047;
    --leaf: #66bb6a;
    --p1: #ff6f59; /* recuerdo */
    --p2: #ff3b6e; /* ella */
    --p3: #e8175d; /* frase */
    --p4: #c4145a; /* foto */
    --p5: #8e3b9e; /* cancion */
    --p6: #3e6ff2; /* futuro */
    --p7: #ffc33d; /* final */
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 20%, var(--night) 0%, var(--night-deep) 70%);
    font-family:'Work Sans', sans-serif;
    color: var(--cream);
    overflow-x:hidden;
  }

  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    padding: 40px 20px 60px;
  }

  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }
  .star{
    position:absolute; width:2px; height:2px; background:var(--gold-soft);
    border-radius:50%; opacity:.5; animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.8;}
  }

  header{
    text-align:center;
    margin-bottom: 24px;
    position:relative; z-index:2;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-style:italic;
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    color: var(--cream);
    letter-spacing:.3px;
  }
  header p{
    margin-top:8px;
    font-weight:300;
    font-size:.95rem;
    color: rgba(243,233,221,.6);
  }

  /* ---- FLOR DE TULIPÁN ESTILO SVG ---- */
  .flower-wrap{
    width: min(78vw, 420px);
    position:relative;
    z-index:2;
    filter: drop-shadow(0 10px 25px rgba(0,0,0,0.5));
  }
  .flower-wrap svg{ width:100%; height:auto; display:block; overflow:visible; }

  .petal-fall{
    cursor:pointer;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform .75s cubic-bezier(.34,.62,.35,1), opacity .6s ease .05s;
  }
  .petal-fall path{ transition: filter .15s ease; }
  .petal-fall:hover path{ filter: brightness(1.15) drop-shadow(0 0 8px rgba(230,196,138,0.5)); }
  
  .petal-fall.done{
    opacity: .25;
    filter: grayscale(.6) brightness(.6);
    pointer-events: none;
  }

  .progress{
    margin-top: 25px;
    font-size:.8rem;
    color: rgba(243,233,221,.55);
    letter-spacing:.5px;
    z-index:2;
  }

  /* ---- OVERLAY MODAL ---- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(15,10,20,.86);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .35s ease;
    z-index:10;
    padding: 24px;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .card{
    max-width: 460px;
    width:100%;
    background: linear-gradient(160deg, #2c2038, #1d1526);
    border: 1px solid rgba(211,161,92,.25);
    border-radius: 22px;
    padding: 38px 32px 32px;
    text-align:center;
    position:relative;
    transform: translateY(14px) scale(.97);
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
    max-height: 82vh;
    overflow-y:auto;
  }
  .overlay.open .card{ transform: translateY(0) scale(1); }

  .card .tag{
    font-size:.72rem;
    letter-spacing:1.5px;
    color: var(--gold-soft);
    font-weight:500;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .card h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 1.5rem;
    margin-bottom: 16px;
    color: var(--cream);
  }
  .card p{
    font-weight:300;
    line-height:1.65;
    color: rgba(243,233,221,.85);
    font-size:.98rem;
  }
  .close-btn{
    position:absolute; top:16px; right:18px;
    background:none; border:none; color: rgba(243,233,221,.5);
    font-size:1.3rem; cursor:pointer; line-height:1;
  }
  .close-btn:hover{ color: var(--cream); }

  /* --- CONTENIDOS ESPECIALES --- */
  .memory-scene{
    display:flex; justify-content:center; gap:10px; margin:10px 0 6px;
    font-size:1.6rem;
  }
  .memory-scene span{ animation: floaty 2.6s ease-in-out infinite; }
  .memory-scene span:nth-child(2){ animation-delay:.3s; }
  .memory-scene span:nth-child(3){ animation-delay:.6s; }
  @keyframes floaty{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }

  .hearts-field{ position:relative; height:70px; margin-bottom:6px; }
  .heart-float{
    position:absolute; bottom:0; font-size:1.1rem; opacity:0;
    animation: riseHeart 3.2s ease-in infinite;
  }
  @keyframes riseHeart{
    0%{ transform: translateY(0) scale(.8); opacity:0; }
    15%{ opacity:1; }
    100%{ transform: translateY(-65px) scale(1.05); opacity:0; }
  }

  .big-phrase{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(1.4rem, 5vw, 1.9rem);
    line-height:1.35;
    color: var(--cream);
    margin: 14px 0 4px;
  }

  .photo-frame{
    width: 100%;
    max-width: 260px;
    aspect-ratio: 4/5;
    margin: 6px auto 4px;
    border-radius: 12px;
    border: 6px solid #fdf8ef;
    box-shadow: 0 10px 26px rgba(0,0,0,.45);
    overflow:hidden;
    position:relative;
    background: linear-gradient(160deg,#3a2c48,#241a30);
  }
  .photo-frame img{
    width:100%; height:100%; object-fit:cover; display:block;
    opacity:0;
    animation: devFoto 2s ease-out forwards .2s;
  }
  @keyframes devFoto{
    0%{ opacity:0; filter: blur(6px) brightness(1.6); }
    100%{ opacity:1; filter: blur(0) brightness(1); }
  }
  .photo-frame .placeholder-icon{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2.2rem; opacity:.35; }

  .player{
    background: rgba(255,255,255,.05);
    border:1px solid rgba(211,161,92,.2);
    border-radius: 14px;
    padding: 16px 18px;
    display:flex; align-items:center; gap:14px;
    margin: 10px 0 4px;
    text-align:left;
  }
  .play-btn{
    width:42px; height:42px; border-radius:50%;
    background: var(--gold);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; cursor:pointer; font-size:1rem; color:var(--night-deep);
    transition: transform .15s ease;
  }
  .play-btn:hover{ transform: scale(1.06); }
  .track-info{ flex:1; }
  .track-info .name{ font-weight:500; font-size:.92rem; color:var(--cream); }
  .track-info .film{ font-size:.78rem; color: rgba(243,233,221,.55); margin-top:2px; }
  .bars{ display:flex; align-items:flex-end; gap:3px; height:20px; }
  .bars span{
    width:3px; background: var(--gold-soft); border-radius:2px;
    animation: eq 1s ease-in-out infinite;
    animation-play-state: paused;
  }
  .bars span:nth-child(1){ height:40%; animation-delay:0s; }
  .bars span:nth-child(2){ height:90%; animation-delay:.15s; }
  .bars span:nth-child(3){ height:60%; animation-delay:.3s; }
  .bars span:nth-child(4){ height:100%; animation-delay:.45s; }
  @keyframes eq{
    0%,100%{ transform: scaleY(.4); }
    50%{ transform: scaleY(1); }
  }
  .player-note{ font-size:.72rem; color:rgba(243,233,221,.4); margin-top:10px; font-weight:300;}

  .future-field{ position:relative; height:80px; margin-bottom:4px; overflow:hidden; }
  .mini-petal{
    position:absolute; bottom:-10px; width:8px; height:14px;
    border-radius: 8px 2px 8px 2px;
    opacity:0;
    animation: riseP 4s ease-in infinite;
  }
  @keyframes riseP{
    0%{ transform: translateY(0) rotate(0deg); opacity:0; }
    10%{ opacity:.9; }
    100%{ transform: translateY(-90px) rotate(200deg); opacity:0; }
  }

  /* --- PANTALLA FINAL --- */
  .final-screen{
    position:fixed; inset:0; background: radial-gradient(ellipse at 50% 30%, #2c2038, var(--night-deep) 75%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 30px; z-index:20;
    opacity:0; pointer-events:none; transition: opacity .8s ease;
  }
  .final-screen.show{ opacity:1; pointer-events:auto; }
  .final-screen h2{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    font-size: clamp(1.6rem, 5vw, 2.4rem); color: var(--cream); margin-bottom:18px;
  }
  .final-screen p{
    max-width: 440px; font-weight:300; line-height:1.7; color: rgba(243,233,221,.8);
  }
  .final-hearts{ position:relative; width:100%; max-width:400px; height:60px; margin-top:24px;}

  .continue-btn{
    margin-top: 28px;
    background: var(--gold);
    color: var(--night-deep);
    border:none;
    padding: 11px 26px;
    border-radius: 999px;
    font-family:'Work Sans', sans-serif;
    font-weight:500;
    font-size:.88rem;
    cursor:pointer;
    transition: transform .2s ease, background .2s ease;
  }
  .continue-btn:hover{ background: var(--gold-soft); transform: translateY(-1px); }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="stage">
  <header>
    <h1>Siete pétalos</h1>
    <p>Tocá cada pétalo. Se va a caer, y su recuerdo va a quedar abierto.</p>
  </header>

  <div class="flower-wrap">
    <svg viewBox="0 0 500 680" xmlns="http://www.w3.org/2000/svg">
      <!-- Tallo -->
      <path d="M250 440 L250 660" stroke="var(--stem)" stroke-width="12" fill="none" stroke-linecap="round"/>
      <!-- Hojas anchas de tulipán -->
      <path d="M248 470 C 150 480, 80 550, 60 660 C 150 640, 220 550, 248 480 Z" fill="var(--leaf)"/>
      <path d="M252 500 C 340 510, 400 570, 430 650 C 350 635, 290 570, 252 510 Z" fill="var(--leaf)"/>

      <!-- Pistilo -->
      <ellipse cx="250" cy="420" rx="20" ry="28" fill="#e8d24a"/>
      <path d="M241 404 L241 440 M250 400 L250 442 M259 404 L259 440" stroke="#b8931f" stroke-width="3" stroke-linecap="round"/>

      <!-- 7 pétalos estructurados -->
      <g id="petals"></g>
    </svg>
  </div>

  <div class="progress" id="progress">0 / 7 pétalos abiertos</div>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="card">
    <button class="close-btn" id="closeBtn">✕</button>
    <div id="cardContent"></div>
  </div>
</div>

<div class="final-screen" id="finalScreen">
  <h2>Y así, sin pétalos.</h2>
  <p>Pero nunca sin vos. Cada pétalo era apenas un momento — quedan muchísimos más por abrir, juntos.</p>
  <div class="final-hearts" id="finalHearts"></div>
  <button class="continue-btn" id="restartBtn">Volver a la flor</button>
</div>

<script>
const content = {
  recuerdo: {
    tag: 'PÉTALO 1 · RECUERDO',
    title: 'Nuestras películas',
    body: `¿Sabés qué recuerdo me encanta? Esas noches en las que me quedaba en tu casa viendo películas juntos. Capaz para cualquiera era simplemente ver una película, pero para mí eran momentos simples que se volvían especiales solamente porque estaba con vos. ❤️`,
    extra: `<div class="memory-scene"><span>🍿</span><span>🕯️</span><span>🎞️</span></div>`
  },
  ella: {
    tag: 'PÉTALO 2 · ELLA',
    title: 'Tu amor',
    body: `Hay algo de vos que me encanta muchísimo: la forma en la que me hacés sentir amado. Me encanta cuando te agarra esa locura de amor y empezás a abrazarme, besarme y decirme cuánto me amás. Me encanta verte así y sentir todo ese amor que tenés por mí. 🥰❤️`,
    extra: `<div class="hearts-field" id="heartsField"></div>`
  },
  frase: {
    tag: 'PÉTALO 3 · FRASE',
    title: '',
    body: '',
    extra: `<p class="big-phrase">Sos todo lo que está bien.</p>`
  },
  foto: {
    tag: 'PÉTALO 4 · FOTO',
    title: 'Ese momento',
    body: `Un lugar favorito con mi persona favorita.`,
    extra: `<div class="photo-frame"><img src="nuestra-foto.jpg" alt="Nosotros"></div>`
  },
  cancion: {
    tag: 'PÉTALO 5 · CANCIÓN',
    title: 'Nuestra canción',
    body: '',
    extra: `<div class="player" id="audioPlayerBox">
        <div class="play-btn" id="playAudioBtn">▶</div>
        <div class="track-info">
          <div class="name">Te Amo y Más - Diego Luna</div>
          <div class="film">El Libro De La Vida</div>
        </div>
        <div class="bars" id="eqBars"><span></span><span></span><span></span><span></span></div>
      </div>
      <audio id="bgMusic" src="cancion.mp3" preload="auto"></audio>
      <div class="player-note">Tocá play para escucharla.</div>`
  },
  futuro: {
    tag: 'PÉTALO 6 · FUTURO',
    title: 'Lo que todavía viene',
    body: `Quiero que siempre estemos juntos y que nos amemos tanto o más que ahora. Quiero seguir compartiendo momentos con vos, seguir riéndonos, seguir haciendo recuerdos y seguir viviendo muchas cosas juntos. ❤️`,
    extra: `<div class="future-field" id="futureField"></div>`
  },
  final: {
    tag: 'PÉTALO 7 · FINAL',
    title: 'Lo más importante',
    body: `Eres lo más hermoso e importante que me pasó. Sos todo lo que está bien. Cuando todo se me cae y las cosas están mal, estás vos para hacerme levantar. Te amo demasiado. ❤️`,
    extra: ``
  }
};

const colors = ['#ff6f59','#ff3b6e','#e8175d','#c4145a','#8e3b9e','#3e6ff2','#ffc33d'];

const starsWrap = document.getElementById('stars');
for(let i=0;i<50;i++){
  const s = document.createElement('div');
  s.className='star';
  s.style.left = Math.random()*100+'vw';
  s.style.top = Math.random()*100+'vh';
  s.style.animationDelay = (Math.random()*3)+'s';
  starsWrap.appendChild(s);
}

const BASE_X = 250, BASE_Y = 420;

// Configuración de los 7 pétalos con el primero arriba (0 grados) y simetría armónica
const petalsConfig = [
  { key:'recuerdo', angle: 0,   color:'var(--p1)', long:true },
  { key:'ella',     angle: -18,  color:'var(--p2)' },
  { key:'frase',    angle: 18,   color:'var(--p3)', long:true },
  { key:'foto',     angle: -36,  color:'var(--p4)' },
  { key:'cancion',  angle: 36,   color:'var(--p5)', long:true },
  { key:'futuro',   angle: -54,  color:'var(--p6)' },
  { key:'final',    angle: 54,   color:'var(--p7)', long:true },
];

const petalGroup = document.getElementById('petals');

function petalPath(long){
  return long
    ? "M0,0 C -34,-30 -46,-82 -32,-128 C -25,-152 -9,-166 0,-176 C 9,-166 25,-152 32,-128 C 46,-82 34,-30 0,0 Z"
    : "M0,0 C -30,-25 -40,-70 -28,-110 C -22,-130 -8,-142 0,-150 C 8,-142 22,-130 28,-110 C 40,-70 30,-25 0,0 Z";
}

const drawOrder = [...petalsConfig].sort((a,b)=> (a.long?0:1) - (b.long?0:1));

drawOrder.forEach(p=>{
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('transform', `translate(${BASE_X},${BASE_Y}) rotate(${p.angle})`);

  const fall = document.createElementNS('http://www.w3.org/2000/svg','g');
  fall.setAttribute('class','petal-fall');
  fall.setAttribute('data-key', p.key);

  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', petalPath(p.long));
  path.setAttribute('fill', p.color);

  fall.appendChild(path);
  g.appendChild(fall);
  petalGroup.appendChild(g);
});

const overlay = document.getElementById('overlay');
const cardContent = document.getElementById('cardContent');
const progressEl = document.getElementById('progress');
const finalScreen = document.getElementById('finalScreen');
let opened = new Set();

function heartsAnim(container){
  container.innerHTML='';
  for(let i=0;i<7;i++){
    const h = document.createElement('div');
    h.className='heart-float';
    h.textContent = '💕';
    h.style.left = (8+Math.random()*84)+'%';
    h.style.animationDelay = (i*0.4)+'s';
    container.appendChild(h);
  }
}
function petalsAnim(container){
  container.innerHTML='';
  for(let i=0;i<10;i++){
    const p = document.createElement('div');
    p.className='mini-petal';
    p.style.left = (5+Math.random()*90)+'%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDelay = (Math.random()*3.5)+'s';
    container.appendChild(p);
  }
}

function openPetal(key){
  const c = content[key];
  cardContent.innerHTML = `
    <div class="tag">${c.tag}</div>
    ${c.title ? `<h2>${c.title}</h2>` : ''}
    ${c.extra || ''}
    ${c.body ? `<p>${c.body}</p>` : ''}
  `;
  overlay.classList.add('open');
  if(key==='ella') heartsAnim(document.getElementById('heartsField'));
  if(key==='futuro') petalsAnim(document.getElementById('futureField'));

  const el = document.querySelector(`.petal-fall[data-key="${key}"]`);
  if(el && !opened.has(key)){
    opened.add(key);
    el.classList.add('falling', 'done');
    progressEl.textContent = `${opened.size} / 7 pétalos abiertos`;
    if(opened.size === 7){
      setTimeout(()=> showFinal(), 800);
    }
  }
}

document.querySelectorAll('.petal-fall').forEach(pf=>{
  pf.addEventListener('click', ()=>{
    const key = pf.dataset.key;
    if(opened.has(key)) return;
    openPetal(key);
  });
});

document.getElementById('closeBtn').addEventListener('click', ()=>{
  const audio = document.getElementById('bgMusic');
  if(audio) audio.pause();
  overlay.classList.remove('open');
});
overlay.addEventListener('click', (e)=>{
  if(e.target === overlay) {
    const audio = document.getElementById('bgMusic');
    if(audio) audio.pause();
    overlay.classList.remove('open');
  }
});

// Control del reproductor de música
document.addEventListener('click', function(e) {
  if (e.target && e.target.id === 'playAudioBtn') {
    const audio = document.getElementById('bgMusic');
    const btn = e.target;
    const bars = document.getElementById('eqBars');
    
    if (audio.paused) {
      audio.play();
      btn.textContent = '❚❚';
      if(bars) bars.style.animationPlayState = 'running';
    } else {
      audio.pause();
      btn.textContent = '▶';
      if(bars) bars.style.animationPlayState = 'paused';
    }
  }
});

function showFinal(){
  overlay.classList.remove('open');
  finalScreen.classList.add('show');
  const fh = document.getElementById('finalHearts');
  fh.innerHTML='';
  for(let i=0;i<8;i++){
    const h = document.createElement('div');
    h.className='heart-float';
    h.textContent = '❤️';
    h.style.left = (5+Math.random()*90)+'%';
    h.style.animationDelay = (i*0.35)+'s';
    fh.appendChild(h);
  }
}
document.getElementById('restartBtn').addEventListener('click', ()=>{
  finalScreen.classList.remove('show');
  // Opcional: recargar o reiniciar estados si se prefiere
  location.reload();
});
</script>
</body>
</html>
